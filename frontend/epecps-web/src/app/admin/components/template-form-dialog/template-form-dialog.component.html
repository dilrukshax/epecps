<div class="dialog-overlay" (click)="onCancel()">
  <div class="dialog-content" (click)="$event.stopPropagation()">
    <div class="dialog-header">
      <h2>{{ getTitle() }}</h2>
      <button class="btn-close" (click)="onCancel()">&times;</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="dialog-body">
        <!-- Error Message -->
        <div class="error-message" *ngIf="error">
          {{ error }}
        </div>

        <!-- Name Field -->
        <div class="form-group">
          <label for="name">Template Name <span class="required">*</span></label>
          <input 
            type="text" 
            id="name" 
            formControlName="name" 
            class="form-control"
            [class.invalid]="getFieldError('name')"
            placeholder="Enter template name">
          <span class="error-text" *ngIf="getFieldError('name')">
            {{ getFieldError('name') }}
          </span>
        </div>

        <!-- Description Field -->
        <div class="form-group">
          <label for="description">Description</label>
          <textarea 
            id="description" 
            formControlName="description" 
            class="form-control"
            rows="4"
            [class.invalid]="getFieldError('description')"
            placeholder="Enter template description (optional)"></textarea>
          <span class="error-text" *ngIf="getFieldError('description')">
            {{ getFieldError('description') }}
          </span>
        </div>
      </div>

      <div class="dialog-footer">
        <button type="button" class="btn btn-secondary" (click)="onCancel()" [disabled]="loading">
          Cancel
        </button>
        <button type="submit" class="btn btn-primary" [disabled]="loading">
          <span *ngIf="loading">Saving...</span>
          <span *ngIf="!loading">{{ mode === 'create' ? 'Create' : 'Update' }}</span>
        </button>
      </div>
    </form>
  </div>
</div>
