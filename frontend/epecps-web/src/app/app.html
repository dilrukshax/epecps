<header style="padding:12px;border-bottom:1px solid #eee;display:flex;gap:12px;align-items:center">
  <strong>EPECPS</strong>
  <span style="flex:1 1 auto"></span>

  <ng-container *ngIf="!isLoggedIn; else loggedInBlock">
    <button (click)="login()">Sign in with Microsoft</button>
  </ng-container>

  <ng-template #loggedInBlock>
    <span>Hi, {{ displayName }}</span>
    <button (click)="logout()">Sign out</button>
  </ng-template>
</header>

<main style="padding:16px">
  <h2>Auth demo</h2>
  <p>Click to call <code>/api/v1/auth/me</code> (token auto-attached by MSAL interceptor).</p>
  <button (click)="callMe()" [disabled]="loading || !isLoggedIn">Call /auth/me</button>

  <div *ngIf="loading" style="margin-top:12px">Loading…</div>
  <pre *ngIf="me" style="background:#fafafa;padding:12px;margin-top:12px">{{ me | json }}</pre>
  <div *ngIf="error" style="color:#b00020;margin-top:12px">{{ error }}</div>
</main>

<router-outlet></router-outlet>
