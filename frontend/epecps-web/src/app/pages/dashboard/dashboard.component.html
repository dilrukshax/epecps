<div class="min-h-screen bg-gray-50">
  <app-header></app-header>
  
  <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <!-- Welcome Section -->
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Welcome back, {{ userName }}!</h1>
      <p class="mt-2 text-gray-600">Here's what's happening with your performance evaluations.</p>
    </div>

    <!-- Stats Grid -->
    <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-4 mb-8">
      <div *ngFor="let stat of stats" 
           class="bg-white overflow-hidden shadow-lg rounded-lg hover:shadow-xl transition-shadow duration-300">
        <div class="p-6">
          <div class="flex items-center">
            <div class="flex-shrink-0 rounded-md p-3" [ngClass]="stat.bgColor">
              <!-- Clock Icon -->
              <svg *ngIf="stat.icon === 'clock'" class="h-6 w-6" [ngClass]="stat.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <!-- Check Icon -->
              <svg *ngIf="stat.icon === 'check'" class="h-6 w-6" [ngClass]="stat.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <!-- Users Icon -->
              <svg *ngIf="stat.icon === 'users'" class="h-6 w-6" [ngClass]="stat.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
              </svg>
              <!-- Target Icon -->
              <svg *ngIf="stat.icon === 'target'" class="h-6 w-6" [ngClass]="stat.color" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
              </svg>
            </div>
            <div class="ml-5 w-0 flex-1">
              <dl>
                <dt class="text-sm font-medium text-gray-500 truncate">{{ stat.name }}</dt>
                <dd class="text-3xl font-bold text-gray-900">{{ stat.value }}</dd>
              </dl>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Content Grid -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
      <!-- Recent Activity -->
      <div class="lg:col-span-2">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
          <div class="px-6 py-5 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-900">Recent Activity</h2>
          </div>
          <ul class="divide-y divide-gray-200">
            <li *ngFor="let activity of recentActivities" class="px-6 py-4 hover:bg-gray-50 transition-colors">
              <div class="flex items-start">
                <div class="flex-shrink-0">
                  <div class="h-2 w-2 rounded-full mt-2"
                       [ngClass]="{
                         'bg-green-500': activity.type === 'success',
                         'bg-blue-500': activity.type === 'info',
                         'bg-yellow-500': activity.type === 'warning'
                       }">
                  </div>
                </div>
                <div class="ml-4 flex-1">
                  <p class="text-sm font-medium text-gray-900">{{ activity.action }}</p>
                  <p class="text-sm text-gray-500">{{ activity.date }}</p>
                </div>
              </div>
            </li>
          </ul>
        </div>
      </div>

      <!-- Quick Actions -->
      <div class="lg:col-span-1">
        <div class="bg-white shadow-lg rounded-lg overflow-hidden">
          <div class="px-6 py-5 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-900">Quick Actions</h2>
          </div>
          <div class="px-6 py-4 space-y-3">
            <button class="w-full flex items-center justify-between px-4 py-3 bg-primary-50 hover:bg-primary-100 text-primary-700 rounded-lg transition-colors">
              <span class="font-medium">Start Self-Evaluation</span>
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
              </svg>
            </button>
            
            <button class="w-full flex items-center justify-between px-4 py-3 bg-blue-50 hover:bg-blue-100 text-blue-700 rounded-lg transition-colors">
              <span class="font-medium">Submit Peer Review</span>
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
              </svg>
            </button>
            
            <button class="w-full flex items-center justify-between px-4 py-3 bg-green-50 hover:bg-green-100 text-green-700 rounded-lg transition-colors">
              <span class="font-medium">View My Goals</span>
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
              </svg>
            </button>
            
            <button class="w-full flex items-center justify-between px-4 py-3 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-lg transition-colors">
              <span class="font-medium">Training Resources</span>
              <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6" />
              </svg>
            </button>
          </div>
        </div>

        <!-- API Test Section -->
        <div class="mt-6 bg-white shadow-lg rounded-lg overflow-hidden">
          <div class="px-6 py-5 border-b border-gray-200">
            <h2 class="text-xl font-bold text-gray-900">API Test</h2>
          </div>
          <div class="px-6 py-4">
            <button (click)="callApiMe()" 
                    [disabled]="loading"
                    class="w-full px-4 py-2 bg-primary-600 hover:bg-primary-700 disabled:bg-gray-400 text-white font-medium rounded-lg transition-colors">
              {{ loading ? 'Loading...' : 'Call /auth/me' }}
            </button>
            
            <div *ngIf="meData" class="mt-4 p-4 bg-gray-50 rounded-lg">
              <pre class="text-xs overflow-auto">{{ meData | json }}</pre>
            </div>
            
            <div *ngIf="error" class="mt-4 p-4 bg-red-50 text-red-800 rounded-lg">
              <p class="text-sm font-medium">Error:</p>
              <p class="text-sm">{{ error }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
