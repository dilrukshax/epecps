<nav class="bg-white shadow-lg">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between h-16">
      <div class="flex items-center">
        <a routerLink="/dashboard" class="flex items-center">
          <svg class="h-8 w-8 text-primary-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z" />
          </svg>
          <span class="ml-2 text-xl font-bold text-gray-900">EPECPS</span>
        </a>

        <div class="hidden md:ml-10 md:flex md:space-x-8" *ngIf="isUserLoggedIn">
          <a routerLink="/dashboard" routerLinkActive="border-primary-500 text-gray-900" [routerLinkActiveOptions]="{exact: true}"
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Dashboard
          </a>
          <a routerLink="/employee/goals" routerLinkActive="border-primary-500 text-gray-900"
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            My Goals
          </a>
          <a routerLink="/evaluations/my-approvals" routerLinkActive="border-primary-500 text-gray-900"
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Evaluations
          </a>
          <a *ngIf="hasRmRole()" routerLink="/employee/rm-assign-goals" routerLinkActive="border-primary-500 text-gray-900"
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Assign Goals
          </a>
          <a *ngIf="hasHrReportsAccess()" routerLink="/employee/hr-reports" routerLinkActive="border-primary-500 text-gray-900"
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            HR Reports
          </a>
          <a *ngIf="hasHrPipCasesAccess()" routerLink="/employee/hr-pip-cases" routerLinkActive="border-primary-500 text-gray-900"
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            PIP Cases
          </a>
          <a *ngIf="hasAdminRole()" routerLink="/admin/dashboard" routerLinkActive="border-primary-500 text-gray-900"
             class="border-transparent text-gray-500 hover:border-gray-300 hover:text-gray-700 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium transition-colors">
            Admin
          </a>
        </div>
      </div>

      <div class="flex items-center">
        <div *ngIf="isUserLoggedIn" class="hidden md:flex md:items-center md:space-x-4">
          <div class="flex items-center space-x-3">
            <div class="h-8 w-8 rounded-full bg-primary-100 flex items-center justify-center">
              <span class="text-sm font-medium text-primary-600">{{ getUserInitials() }}</span>
            </div>
            <div class="text-sm">
              <p class="font-medium text-gray-900">{{ userName }}</p>
              <p class="text-xs text-gray-500">{{ userEmail }}</p>
            </div>
          </div>
          <button (click)="logout()"
                  class="ml-4 px-4 py-2 text-sm font-medium text-gray-700 bg-white border border-gray-300 rounded-md hover:bg-gray-50">
            Sign Out
          </button>
        </div>

        <button *ngIf="!isUserLoggedIn" (click)="login()"
                class="hidden md:inline-flex px-4 py-2 text-sm font-semibold text-white bg-cyan-600 rounded-md hover:bg-cyan-700">
          Sign In
        </button>

        <div class="flex items-center md:hidden">
          <button (click)="toggleMobileMenu()" type="button"
                  class="inline-flex items-center justify-center p-2 rounded-md text-gray-400 hover:text-gray-500 hover:bg-gray-100">
            <span class="sr-only">Open main menu</span>
            <svg *ngIf="!mobileMenuOpen" class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
            <svg *ngIf="mobileMenuOpen" class="block h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
    </div>

    <div *ngIf="mobileMenuOpen" class="md:hidden border-t border-gray-200">
      <div class="pt-2 pb-3 space-y-1" *ngIf="isUserLoggedIn">
        <a (click)="navigateTo('/dashboard')" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-600 cursor-pointer">Dashboard</a>
        <a (click)="navigateTo('/employee/goals')" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-600 cursor-pointer">My Goals</a>
        <a (click)="navigateTo('/evaluations/my-approvals')" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-600 cursor-pointer">Evaluations</a>
        <a *ngIf="hasRmRole()" (click)="navigateTo('/employee/rm-assign-goals')" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-600 cursor-pointer">Assign Goals</a>
        <a *ngIf="hasHrReportsAccess()" (click)="navigateTo('/employee/hr-reports')" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-600 cursor-pointer">HR Reports</a>
        <a *ngIf="hasHrPipCasesAccess()" (click)="navigateTo('/employee/hr-pip-cases')" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-600 cursor-pointer">PIP Cases</a>
        <a *ngIf="hasAdminRole()" (click)="navigateTo('/admin/dashboard')" class="block pl-3 pr-4 py-2 text-base font-medium text-gray-600 cursor-pointer">Admin Dashboard</a>
      </div>

      <div *ngIf="isUserLoggedIn" class="pt-4 pb-3 border-t border-gray-200">
        <div class="flex items-center px-4">
          <div class="h-10 w-10 rounded-full bg-primary-100 flex items-center justify-center">
            <span class="text-sm font-medium text-primary-600">{{ getUserInitials() }}</span>
          </div>
          <div class="ml-3">
            <div class="text-base font-medium text-gray-800">{{ userName }}</div>
            <div class="text-sm font-medium text-gray-500">{{ userEmail }}</div>
          </div>
        </div>
        <div class="mt-3 px-2 space-y-1">
          <button (click)="logout()"
                  class="block w-full text-left px-3 py-2 rounded-md text-base font-medium text-gray-700 hover:text-gray-900 hover:bg-gray-50">
            Sign Out
          </button>
        </div>
      </div>

      <div *ngIf="!isUserLoggedIn" class="p-4 border-t border-gray-200">
        <button (click)="login()" class="w-full rounded-md bg-cyan-600 text-white py-2 font-semibold">Sign In</button>
      </div>
    </div>
  </div>
</nav>
